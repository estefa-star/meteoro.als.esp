<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Meteoro</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-chubby/css/uicons-solid-chubby.css'>
  <link rel="stylesheet" href="/estilos.css">
  <link rel="stylesheet" href="/avisos.css">
</head>

<body>
  <div id="top"><canvas id="cv"></canvas>
    <div id="msg"></div>
  </div>
  <div class="chip" id="chip">conectando…</div>
  <div id="pan" hidden>
    <!--<div style="text-align:center;font-size:16px;line-height:1.3">Mantené apretado sobre un carril y soltá para
      lanzar.<br><span style="opacity:.8;font-size:14px">Cuanto más tiempo mantenés, más rápido va el meteorito (y más
        tardás en poder tirar otro).</span></div>-->
    <div id="cdw">
      <div id="cd"></div>
    </div>
    <div style="text-align:center;font-size:14px;opacity:.85">Impactos tuyos: <b id="hits">0</b></div>
  </div>
  <div id="cam" hidden>
    <div style="position:relative"><video id="vid" autoplay playsinline muted></video>
      <div id="mk0"></div>
      <div id="mk"></div>
    </div>
  </div>
  <div id="roster" hidden>
    <header id="rh"><span id="rt">Jugadores</span><span>▾</span></header>
    <div id="rb">
      <ul id="rl"></ul><button id="lv"><i class="fi fi-sc-arrow-turn-down-left"></i> volver a la galaxia</button>
    </div>
  </div>
  <div class="ov" id="entry">
    <div class="card" style="width:min(92vw,440px)">
      <h1 class="logo">meteoro</h1>
      <p>Poné tu nombre y elegí un universo. Quien entre en el mismo universo, jugará tu partida.</p>
      <input class="txt" id="nm" maxlength="14" placeholder="Tu nombre" autocomplete="off"><select class="txt" id="rm"></select>
      <input class="txt" id="rmNuevo" maxlength="12" placeholder="Nombre de la sala nueva" autocomplete="off" hidden>
      <div id="ths"></div>
      <div style="font-size:13px;opacity:.75">Si el universo ya existe, se usa el ya hecho.</div>
      <div id="err"></div><button class="btn" id="go">Entrar</button>
    </div>
  </div>
  <div class="ov" id="ov" hidden>
    <div class="card">
      <h1 class="logo">meteoro</h1>
      <h2 id="t" style="margin:0 0 6px;font-size:22px"></h2>
      <ol id="rk" hidden></ol>
      <p id="d"></p><button class="btn" id="btn"></button>
      <div><button id="skip" hidden>Pasar turno</button></div>
    </div>
  </div>
  <script src="/avisos.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/sketch.js"></script>
  <script src="/sonido.js"></script>
  <script src="/cliente.js"></script>
</body>

</html>
